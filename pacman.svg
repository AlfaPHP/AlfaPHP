<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">

  <!-- Dinding labirin -->
  <g fill="none" stroke="#0575E6" stroke-width="4" stroke-linecap="round">
    <rect x="10" y="15" width="780" height="130" rx="14"/>
    <line x1="150" y1="15" x2="150" y2="55"/>
    <line x1="150" y1="105" x2="150" y2="145"/>
    <line x1="400" y1="15" x2="400" y2="55"/>
    <line x1="400" y1="105" x2="400" y2="145"/>
    <line x1="650" y1="15" x2="650" y2="55"/>
    <line x1="650" y1="105" x2="650" y2="145"/>
  </g>

  <!-- Pellet kecil -->
  <g fill="#4FC3F7">
    <circle cx="60" cy="80" r="5"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.06;0.061;0.99;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="80" r="5"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.12;0.121;0.99;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="80" r="5"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.27;0.271;0.99;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="80" r="5"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.34;0.341;0.99;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="80" r="5"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.41;0.411;0.99;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="80" r="5"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.57;0.571;0.99;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="80" r="5"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.64;0.641;0.99;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="80" r="5"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.71;0.711;0.99;1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="80" r="5"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.85;0.851;0.99;1" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Power pellet berkedip -->
  <g fill="#00B8FF">
    <circle cx="770" cy="80" r="9">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="80" r="9">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Karakter utama: mulut benar-benar membuka & menutup -->
  <g>
    <path fill="#0575E6">
      <animate attributeName="d"
        values="
          M0,0 L17.3,-10 A20,20 0 1,0 17.3,10 Z;
          M0,0 L19.7,-3.5 A20,20 0 1,0 19.7,3.5 Z;
          M0,0 L17.3,-10 A20,20 0 1,0 17.3,10 Z"
        dur="0.4s" repeatCount="indefinite"/>
    </path>
    <animateMotion path="M -30,80 L 830,80" dur="4.5s" repeatCount="indefinite"/>
  </g>

  <!-- Pengejar dari belakang -->
  <g transform="translate(0,0)">
    <path fill="#8ED6FF" d="M -18,-16 a18,18 0 1,1 36,0 v22 l-6,-6 -6,6 -6,-6 -6,6 -6,-6 -6,6 Z"/>
    <circle cx="-7" cy="-16" r="4" fill="#021B79"/>
    <circle cx="7" cy="-16" r="4" fill="#021B79"/>
    <animateMotion path="M -80,80 L 780,80" dur="4.5s" repeatCount="indefinite"/>
  </g>

</svg>
